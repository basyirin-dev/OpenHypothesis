[project]
name = "openhypothesis"
version = "0.1.0"
description = "A transparent, open-source framework for AI-driven scientific discovery"
readme = "README.md"
authors = [
    { name = "basyirin", email = "amsyar.basy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.2",
    "litellm>=1.86.2",
    "pydantic>=2.13.4",
    "qdrant-client>=1.13.0",
    "duckdb>=1.2.0",
]

[project.scripts]
openhypothesis = "openhypothesis.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
ui = [
    "rich>=15.0.0",
    "typer>=0.25.0",
    "gradio>=6.0.0",
]
eval = [
    "scikit-learn>=1.6.0",
    "datasets>=3.5.0",
    "seaborn>=0.13.0",
]
local-llm = [
    "vllm>=0.8.0",
    "ollama>=0.4.0",
    "transformers>=4.50.0",
    "sae-lens>=6.0.0",
    "transformer-lens>=2.0.0",
    "lm-polygraph>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "evals/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/openhypothesis --cov-report=term-missing"
