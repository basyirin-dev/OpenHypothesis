models:
  exploration:
    provider: openai
    model: gpt-4o
    temperature: 1.4
    max_tokens: 4096
  adversarial:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.9
    max_tokens: 4096
  grounding:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2
    max_tokens: 2048
  feasibility:
    provider: anthropic
    model: claude-haiku-3-20240307
    temperature: 0.3
    max_tokens: 4096
  meta_reasoning:
    provider: openai
    model: o4-mini
    temperature: 0.5
    max_tokens: 8192

router:
  default_max_retries: 3
  retry_after: 5.0
  allowed_fails: 3
  cooldown_time: 60
  request_timeout: 120
  num_retries_on_timeout: 2
  fallback_strategy: cascade

embedding:
  model: "BAAI/bge-m3"
  provider: "sentence-transformers"
  dimension: 1024
  device: "cpu"
  batch_size: 32

qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  collection: "scientific_papers"
  hnsw:
    m: 16
    ef_construct: 200
    ef_search: 256
