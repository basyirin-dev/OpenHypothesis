services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: openhypothesis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openhypothesis

  postgres:
    image: postgres:16-alpine
    container_name: openhypothesis-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openhypothesis
      POSTGRES_USER: openhypothesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openhypothesis}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhypothesis -d openhypothesis"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openhypothesis

  redis:
    image: redis:7-alpine
    container_name: openhypothesis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - openhypothesis

volumes:
  qdrant_data:
  postgres_data:
  redis_data:

networks:
  openhypothesis:
    driver: bridge
